<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sznaps</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<section id="startScreen" class="screen">
    <div class="start-box">
        <h1>⛏️ SZNAPS</h1>
        <p>Gra karciana spod ziemi</p>

        <input
            id="nickname"
            type="text"
            maxlength="20"
            placeholder="Twój pseudonim"
            autocomplete="off"
        >

        <input
            id="room"
            type="text"
            maxlength="20"
            placeholder="Pokój"
            autocomplete="off"
        >

        <button id="joinButton" type="button">
            WEJDŹ DO GRY
        </button>
    </div>
</section>

<section id="lobbyScreen" class="screen">

    <div class="lobby-box">

        <h2>POCZEKALNIA</h2>

        <div class="lobby-room">
            Pokój: <strong id="lobbyRoom">—</strong>
        </div>

        <div id="lobbyStatus" class="lobby-status">
            Oczekiwanie na graczy...
        </div>

        <h3>Gracze</h3>

        <div id="lobbyPlayers"></div>

        <div class="team-selection">

            <h3>Wybierz drużynę</h3>

            <div class="team-buttons">

                <button
                    id="team1Button"
                    type="button"
                    class="team-button"
                    data-team="0"
                >
                    DRUŻYNA 1
                </button>

                <button
                    id="team2Button"
                    type="button"
                    class="team-button"
                    data-team="1"
                >
                    DRUŻYNA 2
                </button>

            </div>

            <div id="selectedTeam" class="selected-team">
                Nie wybrano drużyny
            </div>

        </div>

        <div class="lobby-actions">

            <button
                id="botsButton"
                type="button"
                class="bots-button"
            >
                GRAJ Z BOTAMI
            </button>

            <button
                id="leaveButton"
                type="button"
            >
                OPUŚĆ POKÓJ
            </button>

        </div>

    </div>

</section>

<section id="gameScreen" class="screen">

    <div class="game">

        <div class="game-header">

            <div class="game-title">
                SZNAPS
            </div>

            <div id="trumpDisplay" class="trump">
                Obrany kolor: —
            </div>

        </div>

        <div class="scores">

            <div class="score-box">

                <div id="team1Name" class="score-name">
                    Drużyna 1
                </div>

                <div id="scoreTeam1" class="score-value">
                    0
                </div>

            </div>

            <div class="score-box">

                <div id="team2Name" class="score-name">
                    Drużyna 2
                </div>

                <div id="scoreTeam2" class="score-value">
                    0
                </div>

            </div>

        </div>

        <div class="table">

            <div id="topPlayer" class="player player-top">
                —
            </div>

            <div id="leftPlayer" class="player player-left">
                —
            </div>

            <div id="rightPlayer" class="player player-right">
                —
            </div>

            <div id="playedCards"></div>

            <div id="myCards"></div>

        </div>

        <div id="gameMessage" aria-live="polite">
            —
        </div>

    </div>

</section>

<script src="/socket.io/socket.io.js"></script>
<script src="/game.js"></script>

</body>
</html>
