<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>66</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <!-- START -->
    <section id="startScreen" class="screen">
        <div class="startCard">
            <h1>66</h1>
            <p>Gra karciana</p>

            <input
                id="nickname"
                type="text"
                maxlength="20"
                placeholder="Twój nick"
                autocomplete="off"
            >

            <input
                id="room"
                type="text"
                maxlength="20"
                placeholder="Nazwa pokoju"
                autocomplete="off"
            >

            <button id="joinButton">
                Dołącz do gry
            </button>

            <div id="startMessage"></div>
        </div>
    </section>


    <!-- LOBBY -->
    <section id="lobbyScreen" class="screen hidden">
        <div class="lobbyCard">

            <h2>66</h2>

            <div id="lobbyRoom"></div>
            <div id="lobbyStatus"></div>

            <div id="lobbyPlayers"></div>

            <div class="teamSelection">
                <button id="team1Button">
                    Drużyna 1
                </button>

                <button id="team2Button">
                    Drużyna 2
                </button>
            </div>

            <div id="selectedTeam"></div>

            <button id="botsButton">
                Dodaj boty i rozpocznij
            </button>

            <button
                id="leaveButton"
                class="secondaryButton"
            >
                Opuść pokój
            </button>

        </div>
    </section>


    <!-- GAME -->
    <section id="gameScreen" class="screen hidden">

        <div class="gameContainer">

            <!-- HEADER -->
            <header class="gameHeader">

                <div class="gameTitle">
                    <h1>66</h1>
                </div>

                <div class="trumpBox">
                    <span>Atut</span>
                    <strong id="trumpDisplay">—</strong>
                </div>

            </header>


            <!-- SCORES -->
            <section class="scoreBoard">

                <div class="teamScore teamOne">

                    <div id="team1Name">
                        Drużyna 1
                    </div>

                    <div class="scoreLabel">
                        Punkty gry
                    </div>

                    <strong id="scoreTeam1">
                        0
                    </strong>

                    <div class="overallLabel">
                        Punkty ogólne
                    </div>

                    <span id="overallTeam1">
                        0
                    </span>

                    <div class="gamesLabel">
                        Całe punkty
                    </div>

                    <span id="gamesTeam1">
                        0
                    </span>

                </div>


                <div class="teamScore teamTwo">

                    <div id="team2Name">
                        Drużyna 2
                    </div>

                    <div class="scoreLabel">
                        Punkty gry
                    </div>

                    <strong id="scoreTeam2">
                        0
                    </strong>

                    <div class="overallLabel">
                        Punkty ogólne
                    </div>

                    <span id="overallTeam2">
                        0
                    </span>

                    <div class="gamesLabel">
                        Całe punkty
                    </div>

                    <span id="gamesTeam2">
                        0
                    </span>

                </div>

            </section>


            <!-- TABLE -->
            <main class="gameTable">

                <!-- TOP PLAYER -->
                <div class="tablePlayer topPlayer">

                    <div
                        class="playerName"
                        id="topPlayer"
                    >
                        —
                    </div>

                </div>


                <!-- LEFT PLAYER -->
                <div class="tablePlayer leftPlayer">

                    <div
                        class="playerName"
                        id="leftPlayer"
                    >
                        —
                    </div>

                </div>


                <!-- RIGHT PLAYER -->
                <div class="tablePlayer rightPlayer">

                    <div
                        class="playerName"
                        id="rightPlayer"
                    >
                        —
                    </div>

                </div>


                <!-- CENTER -->
                <div class="tableCenter">

                    <div
                        id="playedCards"
                        class="playedCards"
                    ></div>


                    <!-- ACTION PANEL -->
                    <div
                        id="gameActions"
                        class="gameActions hidden"
                    >

                        <!-- NORMAL / SPECIAL CHOICE -->
                        <div
                            id="choiceActions"
                            class="actionGroup hidden"
                        >

                            <div class="actionTitle">
                                Wybierz:
                            </div>

                            <div class="actionButtons">

                                <button
                                    id="heartButton"
                                    class="suitButton redSuit"
                                >
                                    ♥ Czerwo
                                </button>

                                <button
                                    id="diamondButton"
                                    class="suitButton redSuit"
                                >
                                    ♦ Dzwonek
                                </button>

                                <button
                                    id="clubButton"
                                    class="suitButton blackSuit"
                                >
                                    ♣ Krzak
                                </button>

                                <button
                                    id="spadeButton"
                                    class="suitButton blackSuit"
                                >
                                    ♠ Wino
                                </button>

                                <button
                                    id="betterButton"
                                    class="specialButton"
                                >
                                    Lepsza
                                </button>

                                <button
                                    id="worseButton"
                                    class="specialButton"
                                >
                                    Gorsza
                                </button>

                            </div>

                        </div>


                        <!-- LUFA -->
                        <div
                            id="lufaActions"
                            class="actionGroup hidden"
                        >

                            <div
                                id="lufaTimer"
                                class="actionTitle"
                            >
                                Możesz zawołać Lufę
                            </div>

                            <div class="actionButtons">

                                <button
                                    id="lufaButton"
                                    class="lufaButton"
                                >
                                    Lufa
                                </button>

                                <button
                                    id="backLufaButton"
                                    class="backLufaButton"
                                >
                                    Z powrotem
                                </button>

                            </div>

                        </div>

                    </div>


                    <div
                        id="gameMessage"
                        class="gameMessage"
                    ></div>

                </div>


                <!-- CURRENT PLAYER -->
                <div class="tablePlayer currentPlayer">

                    <div
                        class="playerName"
                        id="currentPlayerName"
                    >
                        Ty
                    </div>

                    <div
                        id="myCards"
                        class="myCards"
                    ></div>

                </div>

            </main>


            <!-- GAME INFO -->
            <div class="gameInfo">

                <span id="currentPlayer">
                    —
                </span>

            </div>

        </div>

    </section>


    <script src="/socket.io/socket.io.js"></script>
    <script src="/game.js"></script>

</body>
</html>
