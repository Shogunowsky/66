<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Sznaps</title>

  <link
    rel="icon"
    href="/favicon.ico"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Alumni+Sans+SC:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <!-- ========================= -->
  <!-- EKRAN STARTOWY -->
  <!-- ========================= -->

  <section
    id="startScreen"
    class="screen"
  >

    <div class="start-box">

      <h1>SZNAPS</h1>

      <p class="subtitle">
        Gra karciana
      </p>

      <label for="nickname">
        Twój nick
      </label>

      <input
        id="nickname"
        type="text"
        maxlength="20"
        placeholder="Wpisz nick"
        autocomplete="off"
      >

      <label for="room">
        Pokój
      </label>

      <input
        id="room"
        type="text"
        maxlength="20"
        placeholder="np. KOPALNIA"
        autocomplete="off"
      >

      <button
        id="joinButton"
        class="main-button"
      >
        WEJDŹ DO GRY
      </button>

    </div>

  </section>


  <!-- ========================= -->
  <!-- POCZEKALNIA -->
  <!-- ========================= -->

  <section
    id="lobbyScreen"
    class="screen"
    style="display: none;"
  >

    <div class="lobby-box">

      <h2>SZNAPS</h2>

      <div
        id="lobbyRoom"
        class="room-code"
      >
        Pokój
      </div>

      <div
        id="lobbyPlayers"
        class="lobby-players"
      ></div>

      <p class="lobby-info">
        Gra rozpocznie się automatycznie.
      </p>

      <button
        id="leaveButton"
        class="secondary-button"
      >
        WYJDŹ
      </button>

    </div>

  </section>


  <!-- ========================= -->
  <!-- EKRAN GRY -->
  <!-- ========================= -->

  <section
    id="gameScreen"
    class="game-screen"
    style="display: none;"
  >

    <!-- GÓRA -->

    <header class="game-header">

      <div class="game-title">
        SZNAPS
      </div>

      <div
        id="trumpDisplay"
        class="trump-display"
      >
        Atu: —
      </div>

      <div class="score-board">

        <div class="score-team">
          <span>Drużyna 1</span>
          <strong id="scoreTeam1">
            0
          </strong>
        </div>

        <div class="score-team">
          <span>Drużyna 2</span>
          <strong id="scoreTeam2">
            0
          </strong>
        </div>

      </div>

    </header>


    <!-- STÓŁ -->

    <main class="table">

      <!-- GÓRNY GRACZ -->

      <div
        id="topPlayer"
        class="player-name player-top"
      >
        Gracz
      </div>


      <!-- LEWY GRACZ -->

      <div
        id="leftPlayer"
        class="player-name player-left"
      >
        Gracz
      </div>


      <!-- PRAWY GRACZ -->

      <div
        id="rightPlayer"
        class="player-name player-right"
      >
        Gracz
      </div>


      <!-- ŚRODEK STOŁU -->

      <div class="table-center">

        <div
          id="gameMessage"
          class="game-message"
        >
          Ładowanie gry...
        </div>

        <div
          id="playedCards"
          class="played-cards"
        ></div>

      </div>

    </main>


    <!-- TWOJE KARTY -->

    <section class="my-area">

      <div class="my-label">
        TWOJE KARTY
      </div>

      <div
        id="myCards"
        class="my-cards"
      ></div>

    </section>

  </section>


  <script src="/socket.io/socket.io.js"></script>

  <script src="/game.js"></script>

</body>
</html>
