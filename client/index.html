<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sznaps — 66</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >
</head>

<body>

    <!-- ========================= -->
    <!-- EKRAN STARTOWY -->
    <!-- ========================= -->

    <section
        id="startScreen"
        class="screen"
    >

        <div class="start-card">

            <h1>Sznaps</h1>

            <p class="subtitle">
                Gra karciana 66
            </p>

            <input
                id="nickname"
                type="text"
                placeholder="Twój nick"
                maxlength="20"
                autocomplete="off"
            >

            <input
                id="room"
                type="text"
                placeholder="Kod pokoju"
                maxlength="12"
                autocomplete="off"
            >

            <button id="joinButton">
                Dołącz do gry
            </button>

            <p
                id="startMessage"
                class="message"
            ></p>

        </div>

    </section>


    <!-- ========================= -->
    <!-- LOBBY -->
    <!-- ========================= -->

    <section
        id="lobbyScreen"
        class="screen hidden"
    >

        <div class="lobby-card">

            <h1>Sznaps</h1>

            <div class="room-info">

                <span>
                    Pokój:
                </span>

                <strong id="lobbyRoom">
                    ------
                </strong>

            </div>

            <p
                id="lobbyStatus"
                class="message"
            >
                Oczekiwanie na graczy...
            </p>


            <!-- GRACZE -->

            <div class="lobby-players">

                <h2>Gracze</h2>

                <div id="lobbyPlayers">
                    <div class="empty-player">
                        Oczekiwanie...
                    </div>
                </div>

            </div>


            <!-- DRUŻYNY -->

            <div class="team-selection">

                <h2>Wybierz drużynę</h2>

                <div class="team-buttons">

                    <button
                        id="team1Button"
                        type="button"
                    >
                        Drużyna 1
                    </button>

                    <button
                        id="team2Button"
                        type="button"
                    >
                        Drużyna 2
                    </button>

                </div>

                <p class="selected-team-text">
                    Wybrana drużyna:
                    <strong id="selectedTeam">
                        brak
                    </strong>
                </p>

            </div>


            <!-- START Z BOTAMI -->

            <button
                id="botsButton"
                type="button"
            >
                Graj z botami
            </button>


            <!-- WYJŚCIE -->

            <button
                id="leaveButton"
                type="button"
                class="secondary-button"
            >
                Opuść pokój
            </button>

        </div>

    </section>


    <!-- ========================= -->
    <!-- GRA -->
    <!-- ========================= -->

    <section
        id="gameScreen"
        class="screen hidden"
    >

        <div class="game-container">


            <!-- GÓRA INFORMACYJNA -->

            <div class="game-header">

                <div class="trump-info">

                    <span>
                        Atut:
                    </span>

                    <strong id="trumpDisplay">
                        -
                    </strong>

                </div>


                <div class="scores">

                    <div class="score-team">

                        <span id="team1Name">
                            Drużyna 1
                        </span>

                        <strong id="scoreTeam1">
                            0
                        </strong>

                        <small>
                            Gra
                        </small>

                        <span id="overallTeam1">
                            0
                        </span>

                        <small>
                            Ogólne
                        </small>

                        <span id="gamesTeam1">
                            0
                        </span>

                        <small>
                            66
                        </small>

                    </div>


                    <div class="score-team">

                        <span id="team2Name">
                            Drużyna 2
                        </span>

                        <strong id="scoreTeam2">
                            0
                        </strong>

                        <small>
                            Gra
                        </small>

                        <span id="overallTeam2">
                            0
                        </span>

                        <small>
                            Ogólne
                        </small>

                        <span id="gamesTeam2">
                            0
                        </span>

                        <small>
                            66
                        </small>

                    </div>

                </div>

            </div>


            <!-- STÓŁ -->

            <div class="game-table">


                <!-- PARTNER / GÓRA -->

                <div
                    id="topPlayer"
                    class="player player-top"
                >
                    Partner
                </div>


                <!-- LEWY GRACZ -->

                <div
                    id="leftPlayer"
                    class="player player-left"
                >
                    Lewy
                </div>


                <!-- PRAWA GRACZ -->

                <div
                    id="rightPlayer"
                    class="player player-right"
                >
                    Prawy
                </div>


                <!-- KARTY NA STOLE -->

                <div
                    id="playedCards"
                    class="played-cards"
                ></div>


                <!-- KOMUNIKAT -->

                <div
                    id="gameMessage"
                    class="game-message"
                ></div>


                <!-- MOJE KARTY -->

                <div
                    id="myCards"
                    class="my-cards"
                ></div>

            </div>

        </div>

    </section>


    <!-- SOCKET.IO -->

    <script src="/socket.io/socket.io.js"></script>

    <!-- LOGIKA GRY -->

    <script src="/game.js"></script>

</body>
</html>
